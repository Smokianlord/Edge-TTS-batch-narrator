name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile src/app.py src/backend.py

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller EdgeTTSBatchNarrator.spec --noconfirm --clean

      - name: SHA256
        shell: pwsh
        run: |
          $exe = 'dist/EdgeTTSBatchNarrator-v1.0.0-win64.exe'
          (Get-FileHash $exe -Algorithm SHA256).Hash + '  EdgeTTSBatchNarrator-v1.0.0-win64.exe' | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdgeTTSBatchNarrator-v1.0.0-win64
          path: |
            dist/EdgeTTSBatchNarrator-v1.0.0-win64.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Edge TTS Batch Narrator v1.0.0
          body_path: RELEASE_NOTES.md
          files: |
            dist/EdgeTTSBatchNarrator-v1.0.0-win64.exe
            dist/SHA256SUMS.txt
